<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Nightpage<span>Google Docs and Amazon</span></h1>
    <label class="switch" title="Turn the theme on or off">
      <input type="checkbox" id="enabled">
      <span class="track"><span class="knob"></span></span>
    </label>
  </header>

  <div class="body" id="body">
    <section>
      <div class="row">
        <label for="intensity">Black level</label>
        <output id="intensity-out">30</output>
      </div>
      <input type="range" id="intensity" min="0" max="100" step="1">
      <div class="preview" id="preview">
        <span>Document text</span>
      </div>
    </section>

    <section>
      <label class="check">
        <input type="checkbox" id="keepMedia">
        <span>
          Keep image colors
          <em>Restores photos and avatars. Vivid reds and yellows
          stay muted</em>
        </span>
      </label>
    </section>
  </div>

  <footer>
    <button id="shortcut" class="link">Alt+Shift+D — toggle</button>
    <button id="reset" class="link">Reset</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
